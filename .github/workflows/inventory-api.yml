name: Inventory API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: inventory-api
        run: npm ci

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/ziyasalar/inventory-api:latest \
            ./inventory-api

      - name: Push Docker image
        run: |
          docker push ghcr.io/ziyasalar/inventory-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Web App to pull latest image
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp restart \
              --name ${{ vars.INVENTORY_APP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}